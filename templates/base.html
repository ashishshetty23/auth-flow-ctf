<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VaultLogin{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0f17; color: #e6edf3;
    }
    .card {
      width: 100%; max-width: 420px;
      background: #121823; border: 1px solid #263041; border-radius: 14px;
      padding: 28px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    .brand { font-size: 1.35rem; font-weight: 700; margin: 0 0 2px; }
    .tag { color: #8b98a9; margin: 0 0 22px; font-size: .92rem; }
    label { display: block; font-size: .85rem; color: #aeb9c7; margin-bottom: 4px; }
    input {
      width: 100%; padding: 11px 13px; margin-bottom: 16px;
      background: #0b0f17; border: 1px solid #2b3647; border-radius: 9px;
      color: #e6edf3; font: inherit;
    }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 9px; cursor: pointer;
      background: #2f6feb; color: #fff; font: inherit; font-weight: 600;
    }
    .err { background:#2a1115; border:1px solid #5c1f27; color:#ff9a9a;
           padding:10px 12px; border-radius:8px; margin-bottom:16px; font-size:.9rem; }
    .hint { margin-top:18px; padding:12px; border:1px dashed #2b3647;
            border-radius:9px; color:#8b98a9; font-size:.85rem; }
    .flag { margin-top:16px; background:#0d2818; border:1px solid #238636;
            border-radius:9px; padding:14px; font-family:ui-monospace,monospace;
            color:#7ee787; word-break:break-all; }
    .warn { margin-top:16px; background:#2a2411; border:1px solid #6b5a1f;
            border-radius:9px; padding:12px; color:#f2d98d; font-size:.88rem; }
    a { color:#58a6ff; }
    code { background:#0b0f17; padding:1px 5px; border-radius:5px; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
